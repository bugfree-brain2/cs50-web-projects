{% extends 'auctions/layout.html' %}
{% block body%}
<h1>Create listing</h1>
<form  action="{% url 'create'  %}" method="post" class="d-flex flex-column gap-3">
    {% csrf_token %}
    <div class="form-group">
        <input class="form-control" type="text" name="title" placeholder="enter a title" required>
    </div>
    <div class="form-group">
        <input class="form-control"  type="text" name="description" placeholder="enter a description" required>
    </div>
    <div class="form-group">
        <input class="form-control" type="text" name="image-url" placeholder="enter an url for the image" required>
    </div>
    <div class="form-group">
        <input class="form-control" type="number" name="bid" placeholder="enter an ammount of bid to start the bidding" required>
    </div>
    <p>choose a catagory</p>
    <select name="catagory" class="form-select mb-3 " style="width: 100px;" required>
        {% for cat in catagories %}
            <option value="{{cat}}">{{cat}}</option>
        {% endfor %}
    </select>
    <input class="btn btn-primary"  type="submit" value="Create" style="width: 100px;">
</form>
{% endblock %}
